name: Xcode 27 compatibility

on:
  push:
    branches: [main, develop, master]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - .github/**
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
          case "$(xcodebuild -version)" in
            "Xcode 27."*) ;;
            *) echo "::error::Xcode 27 is required"; exit 1 ;;
          esac
      - name: Select app dependency baseline
        run: cp .github/compatibility/Package.resolved Package.resolved
      - name: Run offline wallet and HTTP regression tests
        run: >-
          swift test --force-resolved-versions
          --filter 'localTests\.(BIP32KeystoreTests|BIP32MnemonicPhraseStringTests|BIP32MnemonicPhraseStringArrayTests|BIP44Tests|BIP44ErrorTests|HDversionTest|HTTPCompatibilityTests)'
